[project]
name = "add-mandarin-readme"
version = "0.1.0"
description = "A CLI tool to translate README.md to Mandarin Chinese using LLM"
authors = [
    {name = "Author",email = "author@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "click (>=8.3.3,<9.0.0)",
    "openai (>=2.32.0,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)"
]

[project.scripts]
add-mandarin-readme = "add_mandarin_readme.cli:main"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
